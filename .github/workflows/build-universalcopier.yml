name: Build UniversalCopier APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/UniversalCopier/**'
      - '.github/workflows/build-universalcopier.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/UniversalCopier
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for d in /usr/local/lib/android/sdk /usr/local/share/android-sdk "$HOME/android-sdk" "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then SDK_ROOT="$d"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK root not found" >&2
            exit 1
          fi
          echo "Using ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER=""
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name 'sdkmanager*' || true
            exit 1
          fi
          chmod +x "$SDKMANAGER" || true
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('projects/UniversalCopier/**/*.gradle*', 'projects/UniversalCopier/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "No ANDROID_KEYSTORE_BASE64 secret; building debug APK."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            ./gradlew --no-daemon assembleRelease --stacktrace
            echo "APK_DIR=app/build/outputs/apk/release" >> "$GITHUB_ENV"
            echo "APK_ARTIFACT=UniversalCopier-release-apk" >> "$GITHUB_ENV"
            echo "APK_PATH_GLOB=projects/UniversalCopier/app/build/outputs/apk/release/*.apk" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon assembleDebug --stacktrace
            echo "APK_DIR=app/build/outputs/apk/debug" >> "$GITHUB_ENV"
            echo "APK_ARTIFACT=UniversalCopier-debug-apk" >> "$GITHUB_ENV"
            echo "APK_PATH_GLOB=projects/UniversalCopier/app/build/outputs/apk/debug/*.apk" >> "$GITHUB_ENV"
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls "$APK_DIR"/*.apk | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"
          sha256sum "$APK" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: ${{ env.APK_PATH_GLOB }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to site
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: com.yahya.universalcopy-v1.9.apk
        run: |
          set -euo pipefail
          cp "$APK_PATH" "$GITHUB_WORKSPACE/apps/$APK_NAME"
          SHA256=$(sha256sum "$GITHUB_WORKSPACE/apps/$APK_NAME" | awk '{print $1}')
          cd "$GITHUB_WORKSPACE"
          python3 - "$APK_NAME" "$SHA256" <<'PY'
import json
import pathlib
import re
import sys
from datetime import datetime, timezone

filename = sys.argv[1]
sha256 = sys.argv[2]
manifest_path = pathlib.Path("apps/manifest.json")
data = json.loads(manifest_path.read_text(encoding="utf-8"))
apps = data["apps"] if isinstance(data, dict) and "apps" in data else data
old = next((a for a in apps if a.get("package") == "com.yahya.universalcopy"), {})
apps = [a for a in apps if a.get("package") != "com.yahya.universalcopy" and a.get("filename") != filename]
entry = {
    "name": "ناسخ شامل",
    "package": "com.yahya.universalcopy",
    "version": "v1.9",
    "description": "تحسينات العربية وتحديد التطبيق المستهدف وشريط إجراءات سفلي داخل التطبيق",
    "category": "tools",
    "filename": filename,
    "size": pathlib.Path("apps", filename).stat().st_size,
    "sha256": sha256,
    "updatedAt": datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
    "icon": old.get("icon", "assets/uploads/com.yahya.universalcopy.jpg"),
    "screenshots": old.get("screenshots", [
        "assets/uploads/screens/com.yahya.universalcopy-1.jpg",
        "assets/uploads/screens/com.yahya.universalcopy-2.jpg",
        "assets/uploads/screens/com.yahya.universalcopy-3.jpg",
    ]),
    "type": "APK",
}
apps.insert(0, entry)
if isinstance(data, dict):
    data["apps"] = apps
    out = data
else:
    out = apps
manifest_path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

sums_path = pathlib.Path("apps/SHA256SUMS.txt")
lines = [line for line in sums_path.read_text(encoding="utf-8").splitlines()
         if filename not in line and "com.yahya.universalcopy-v" not in line]
lines.append(f"{sha256}  {filename}")
sums_path.write_text("\n".join(sorted(lines)) + "\n", encoding="utf-8")

sw_path = pathlib.Path("sw.js")
sw = sw_path.read_text(encoding="utf-8")
stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
sw = re.sub(r'var SW_VERSION = "[^"]+";', f'var SW_VERSION = "uc-{stamp}";', sw, count=1)
sw_path.write_text(sw, encoding="utf-8")
PY
          git config user.name "Yahya Website Bot"
          git config user.email "41614146+ehea1973com-star@users.noreply.github.com"
          git add "apps/$APK_NAME" apps/manifest.json apps/SHA256SUMS.txt sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish UniversalCopier v1.9 [skip ci]"
            git push origin HEAD:main
          fi
