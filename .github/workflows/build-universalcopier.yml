name: Build UniversalCopier APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/UniversalCopier/**'
      - '.github/workflows/build-universalcopier.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/UniversalCopier
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('projects/UniversalCopier/**/*.gradle*', 'projects/UniversalCopier/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"
          sha256sum "$APK" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCopier-debug-apk
          path: projects/UniversalCopier/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
