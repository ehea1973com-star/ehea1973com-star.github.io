<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
  <rect width="900" height="460" fill="#0b1220"/>
  <text x="450" y="34" fill="#e5eefc" font-size="22" font-family="Arial" text-anchor="middle" font-weight="700">مخطط مبسّط لمكونات هاتف حديث</text>
  <rect x="330" y="60" width="240" height="360" rx="28" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
  <rect x="350" y="90" width="200" height="120" rx="10" fill="#0b2540" stroke="#60a5fa"/><text x="450" y="140" fill="#fff" font-size="14" text-anchor="middle">الشاشة/اللمس</text><text x="450" y="162" fill="#9fb3d1" font-size="11" text-anchor="middle">AMOLED / LCD</text>
  <rect x="350" y="220" width="95" height="55" rx="8" fill="#132a1f" stroke="#34d399"/><text x="397" y="252" fill="#fff" font-size="12" text-anchor="middle">SoC/CPU</text>
  <rect x="455" y="220" width="95" height="55" rx="8" fill="#1f1a33" stroke="#a78bfa"/><text x="502" y="244" fill="#fff" font-size="11" text-anchor="middle">RAM/Storage</text><text x="502" y="262" fill="#9fb3d1" font-size="10" text-anchor="middle">UFS/eMMC</text>
  <rect x="350" y="285" width="95" height="45" rx="8" fill="#2a1f12" stroke="#f59e0b"/><text x="397" y="312" fill="#fff" font-size="12" text-anchor="middle">PMIC/شحن</text>
  <rect x="455" y="285" width="95" height="45" rx="8" fill="#102a33" stroke="#22d3ee"/><text x="502" y="312" fill="#fff" font-size="12" text-anchor="middle">RF/مودم</text>
  <rect x="350" y="340" width="200" height="45" rx="8" fill="#2a1320" stroke="#fb7185"/><text x="450" y="367" fill="#fff" font-size="12" text-anchor="middle">بطارية + USB-C + حساسات</text>
  <rect x="40" y="90" width="220" height="70" rx="12" fill="#111827" stroke="#60a5fa"/><text x="150" y="120" fill="#fff" font-size="13" text-anchor="middle">كاميرات/FaceID</text><text x="150" y="142" fill="#9fb3d1" font-size="11" text-anchor="middle">ISP داخل المعالج</text>
  <rect x="40" y="190" width="220" height="70" rx="12" fill="#111827" stroke="#f59e0b"/><text x="150" y="220" fill="#fff" font-size="13" text-anchor="middle">دائرة الشحن/USB</text><text x="150" y="242" fill="#9fb3d1" font-size="11" text-anchor="middle">VBUS, CC, حماية</text>
  <rect x="40" y="290" width="220" height="70" rx="12" fill="#111827" stroke="#34d399"/><text x="150" y="320" fill="#fff" font-size="13" text-anchor="middle">صوت/اهتزاز</text><text x="150" y="342" fill="#9fb3d1" font-size="11" text-anchor="middle">Codec, Amp, Haptics</text>
  <rect x="640" y="90" width="220" height="70" rx="12" fill="#111827" stroke="#22d3ee"/><text x="750" y="120" fill="#fff" font-size="13" text-anchor="middle">شبكات</text><text x="750" y="142" fill="#9fb3d1" font-size="11" text-anchor="middle">4G/5G, WiFi, BT, GNSS</text>
  <rect x="640" y="190" width="220" height="70" rx="12" fill="#111827" stroke="#a78bfa"/><text x="750" y="220" fill="#fff" font-size="13" text-anchor="middle">ذاكرة/تخزين</text><text x="750" y="242" fill="#9fb3d1" font-size="11" text-anchor="middle">Firmware, eMMC/UFS</text>
  <rect x="640" y="290" width="220" height="70" rx="12" fill="#111827" stroke="#fb7185"/><text x="750" y="320" fill="#fff" font-size="13" text-anchor="middle">أمان</text><text x="750" y="342" fill="#9fb3d1" font-size="11" text-anchor="middle">Secure Boot, FRP</text>
  <line x1="260" y1="125" x2="330" y2="150" stroke="#60a5fa" stroke-width="2"/><line x1="260" y1="225" x2="350" y2="307" stroke="#f59e0b" stroke-width="2"/><line x1="260" y1="325" x2="350" y2="360" stroke="#34d399" stroke-width="2"/>
  <line x1="640" y1="125" x2="570" y2="307" stroke="#22d3ee" stroke-width="2"/><line x1="640" y1="225" x2="550" y2="247" stroke="#a78bfa" stroke-width="2"/><line x1="640" y1="325" x2="550" y2="247" stroke="#fb7185" stroke-width="2"/>
</svg>
